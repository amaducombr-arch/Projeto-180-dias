name: Android CI - Projeto 180 Dias

on:
  push:
    branches:
      - etapa-4.1/estrutura-original
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Gradle validation (JDK 17 / SDK 36)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout authorized branch
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK 36 and required build tools
        run: |
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;35.0.0"
          yes | sdkmanager --licenses

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Verify toolchain
        run: |
          java -version
          gradle --version
          sdkmanager --list_installed

      - name: Generate official Gradle Wrapper
        run: gradle wrapper --gradle-version 8.13 --distribution-type bin

      - name: Verify generated Wrapper
        run: |
          test -f gradlew
          test -f gradlew.bat
          test -f gradle/wrapper/gradle-wrapper.jar
          test -f gradle/wrapper/gradle-wrapper.properties
          chmod +x gradlew
          ./gradlew --version

      - name: Gradle Sync and project configuration
        run: ./gradlew --no-daemon help

      - name: Gradle clean
        run: ./gradlew --no-daemon clean

      - name: Unit tests
        run: ./gradlew --no-daemon test

      - name: Android debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload build outputs and generated Wrapper
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: projeto-180-dias-etapa-4.1-b-${{ github.run_number }}
          if-no-files-found: warn
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/reports/tests/
            app/build/test-results/
            gradlew
            gradlew.bat
            gradle/wrapper/gradle-wrapper.jar
            gradle/wrapper/gradle-wrapper.properties
